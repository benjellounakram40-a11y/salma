<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b12">
<title>Pour Salma — une fleur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#f8eff0;--muted:#ad9ca7;--rose:#d95770}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#100b12;color:var(--ink);font-family:'DM Sans',sans-serif;overflow:hidden}.scene{position:relative;display:grid;place-items:center;width:100%;height:100%;min-height:600px;isolation:isolate;background:radial-gradient(ellipse at 50% 46%,#3b1828 0,#21101e 31%,#100b12 70%)}.scene:before{content:'';position:absolute;inset:0;z-index:-1;opacity:.19;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.17'/%3E%3C/svg%3E")}.topline{position:absolute;top:34px;left:42px;right:42px;display:flex;justify-content:space-between;align-items:center;color:#c6afb9;font-size:10px;letter-spacing:.24em;text-transform:uppercase}.brand{display:flex;gap:12px;align-items:center}.brand i{width:6px;height:6px;border-radius:100%;background:#e7808d;box-shadow:0 0 14px #ed7487}.counter{opacity:.7}.content{position:relative;width:min(100%,920px);height:min(88vh,780px);min-height:590px;display:grid;place-items:center}.aura{position:absolute;width:min(76vw,590px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(186,43,71,.20),rgba(114,23,63,.09) 39%,transparent 69%);filter:blur(8px);opacity:0;transform:scale(.7);transition:opacity 2s ease,transform 2.5s cubic-bezier(.2,.7,.2,1)}.started .aura{opacity:1;transform:scale(1)}#flower{position:absolute;width:min(47vw,390px);height:min(78vh,700px);min-height:0;object-fit:contain;opacity:0;transform:translateY(35px) scale(.92);transition:opacity 1.6s ease,transform 2.6s cubic-bezier(.18,.72,.16,1);filter:drop-shadow(0 24px 30px rgba(0,0,0,.26))}.started #flower{opacity:1;transform:translateY(0) scale(1);animation:roseSway 5.2s ease-in-out 2.1s infinite}@keyframes roseSway{0%,100%{transform:translateY(0) rotateZ(-1deg) rotateY(-2deg)}50%{transform:translateY(-5px) rotateZ(1.2deg) rotateY(2deg)}}.intro{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:26px;transform:translateY(30px);opacity:1;transition:opacity .8s ease,transform .8s ease}.started .intro{opacity:0;pointer-events:none;transform:translateY(-16px)}.eyebrow{color:#e4aab4;font-size:10px;letter-spacing:.32em;text-transform:uppercase}.invite{font:500 clamp(28px,5vw,48px)/1.2 'Playfair Display',serif;text-align:center;max-width:420px}.button{appearance:none;border:1px solid rgba(232,171,183,.55);border-radius:999px;background:rgba(255,255,255,.035);padding:15px 26px;color:#fae8eb;font:400 10px 'DM Sans',sans-serif;letter-spacing:.23em;text-transform:uppercase;cursor:pointer;transition:background .3s,border-color .3s,transform .3s;display:flex;align-items:center;gap:14px}.button:hover{background:rgba(255,255,255,.11);border-color:#f3bac3;transform:translateY(-2px)}.button:focus-visible{outline:2px solid #f3bac3;outline-offset:5px}.arrow{font-size:16px;line-height:8px}.signature{position:absolute;bottom:65px;text-align:center;opacity:0;transform:translateY(18px);transition:opacity 1.5s ease,transform 1.5s ease;z-index:2}.started .signature{opacity:1;transform:translateY(0);transition-delay:3.8s}.signature span{display:block;font:italic 500 clamp(46px,8vw,78px)/1.1 'Playfair Display',serif;letter-spacing:.015em;background:linear-gradient(120deg,#fff4ee 10%,#efb8be 55%,#c56b86);color:transparent;background-clip:text;-webkit-background-clip:text;text-shadow:0 10px 38px rgba(200,74,104,.2)}.signature small{display:block;margin-top:12px;color:#c8aeb7;font-size:9px;letter-spacing:.34em;text-transform:uppercase;opacity:.8}.hint{position:absolute;bottom:27px;color:#8e7b87;font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity 1s ease 4.7s}.started .hint{opacity:.65}.music{position:absolute;bottom:25px;left:42px;border:0;background:none;color:#b69eaa;font:10px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity .8s ease 5s}.started .music{opacity:.72}.music:hover{opacity:1}.replay{position:absolute;bottom:25px;right:42px;border:0;background:none;color:#b69eaa;font:10px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity .8s ease 5s}.started .replay{opacity:.7}.replay:hover{opacity:1}.foot{position:absolute;bottom:34px;left:42px;color:#8e7b87;font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.65}.started .foot{opacity:0;transition:opacity .5s}@media(max-width:600px){.topline{top:24px;left:22px;right:22px;font-size:8px}.foot{left:22px;bottom:27px}.replay{right:22px;bottom:20px}.music{left:22px;bottom:20px}.signature{bottom:82px}.hint{bottom:29px}.content{min-height:550px}#flower{width:min(76vw,370px);height:67vh;min-height:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style></head>
<body><main class="scene" id="scene"><header class="topline"><div class="brand"><i></i> Petite merveille</div><div class="counter">Une fleur, pour toi</div></header><section class="content" aria-label="Une fleur rouge en trois dimensions"><div class="aura"></div><img id="flower" src="rose.png" alt="Rose rouge réaliste avec sa tige et ses feuilles"><div class="intro"><div class="eyebrow">Un petit moment rien qu’à toi</div><div class="invite">Une surprise<br>t’attend ici.</div><button class="button" id="open"><span>Découvrir</span><span class="arrow">↗</span></button></div><div class="signature"><span>Salma</span><small>Avec tendresse</small></div></section><div class="foot">Créée juste pour toi&nbsp; · &nbsp;✳</div><button class="music" id="music" aria-label="Couper la musique" aria-pressed="true">♫ &nbsp;Musique</button><div class="hint">Laisse la fleur éclore</div><button class="replay" id="replay">↺ &nbsp;Revoir</button></main>
<script>
const scene=document.querySelector("#scene"),musicButton=document.querySelector("#music");
let audio,master,playing=false,grooveTimer,beat=0;
const progression=[
 {root:43.65,walk:[43.65,55,65.41,73.42],chord:[174.61,220,261.63,329.63,392]},
 {root:36.71,walk:[36.71,46.25,55,61.74],chord:[146.83,174.61,220,261.63,329.63]},
 {root:43.65,walk:[43.65,55,65.41,77.78],chord:[174.61,207.65,261.63,311.13,392]},
 {root:32.70,walk:[32.70,41.20,49,58.27],chord:[130.81,164.81,196,233.08,293.66]}
];
function envelope(g,now,peak,attack,decay){g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(peak,now+attack);g.gain.exponentialRampToValueAtTime(.0001,now+decay)}
function piano(freq,when,level=.09,duration=.9){const fundamental=audio.createOscillator(),harmonic=audio.createOscillator(),body=audio.createGain(),tine=audio.createGain(),out=audio.createGain();fundamental.type="sine";fundamental.frequency.setValueAtTime(freq,when);harmonic.type="sine";harmonic.frequency.setValueAtTime(freq*2.01,when);body.gain.value=.8;tine.gain.value=.18;envelope(out,when,level,.012,duration);fundamental.connect(body);body.connect(out);harmonic.connect(tine);tine.connect(out);out.connect(master);fundamental.start(when);harmonic.start(when);fundamental.stop(when+duration+.1);harmonic.stop(when+duration+.1)}
function bass(freq,when){const o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();o.type="triangle";o.frequency.setValueAtTime(freq,when);filter.type="lowpass";filter.frequency.value=430;envelope(g,when,.12,.018,.48);o.connect(filter);filter.connect(g);g.connect(master);o.start(when);o.stop(when+.55)}
function brush(when,accent=false){const n=Math.floor(audio.sampleRate*.14),buf=audio.createBuffer(1,n,audio.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),g=audio.createGain();src.buffer=buf;filter.type="highpass";filter.frequency.value=accent?1100:5600;envelope(g,when,accent?.018:.009,.004,.14);src.connect(filter);filter.connect(g);g.connect(master);src.start(when)}
const melody=[392,440,523.25,587.33,523.25,493.88,440,392,349.23,392,440,493.88,440,392,349.23,329.63];
function tick(){if(!playing)return;const now=audio.currentTime+.025,bar=Math.floor(beat/4)%4,b=beat%4,c=progression[bar];bass(c.walk[b],now);brush(now,b===1||b===3);if(b===1||b===3){c.chord.forEach((f,i)=>{const when=now+i*.009;piano(f,when,.052,.74)})}if(b===2&&(bar===1||bar===3)){const note=melody[Math.floor(beat/2)%melody.length];piano(note,now,.055,1.15)}beat++}
function startMusic(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.62;master.connect(audio.destination);grooveTimer=setInterval(tick,Math.round(60000/88))}audio.resume();playing=true}
function setMusic(on){playing=on;if(master)master.gain.setTargetAtTime(on?.62:0,audio.currentTime,.12);musicButton.textContent=on?"♫  Jazz doux":"♫  Son coupé";musicButton.setAttribute("aria-pressed",String(on));musicButton.setAttribute("aria-label",on?"Couper la musique":"Activer la musique")}
function start(){scene.classList.add("started");if(!audio)startMusic();else if(musicButton.getAttribute("aria-pressed")==="false")setMusic(true)}
document.querySelector("#open").addEventListener("click",start);document.querySelector("#replay").addEventListener("click",()=>scene.classList.remove("started"));musicButton.addEventListener("click",()=>{if(!audio)startMusic();else setMusic(!playing)});
</script></body></html>
